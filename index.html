<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maryam | The Midnight Birthday Edition</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap');
:root{--bg:#08060b;--panel:#17111c;--pink:#f2a4c7;--violet:#c4a8ff;--white:#fff5fb;--muted:#b7a8b8;--line:#39283d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--white);font-family:'DM Sans',sans-serif}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--pink);outline-offset:4px}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 15% 15%,#61244230,transparent 40%),radial-gradient(ellipse at 90% 85%,#49307530,transparent 40%)}
#stars:after{content:"✧   ·       ✦       ·   ✧";position:absolute;inset:12% 5%;font-size:20px;letter-spacing:50px;line-height:8;opacity:.15;animation:glow 5s infinite alternate}
@keyframes glow{to{opacity:.45}}
#app{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column}
header{height:70px;border-bottom:1px solid #ffffff12;display:flex;align-items:center;justify-content:space-between;padding:0 5%;gap:12px}
.logo{font:italic 23px 'Playfair Display',serif;color:var(--pink)}
.progress{display:flex;gap:6px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;background:#4b3b4d}
.dot.active{background:var(--pink);box-shadow:0 0 12px var(--pink)}
#screen{width:min(1050px,90%);margin:auto;padding:38px 0 24px;flex:1;display:flex;align-items:center;animation:appear .55s ease}
@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.screen-content{width:100%}
.eyebrow{font-size:10px;letter-spacing:4px;color:var(--pink);text-transform:uppercase;line-height:2}
h1,h2,h3,p{margin-top:0}
h1{font:clamp(48px,9vw,94px)/.98 'Playfair Display',serif;letter-spacing:-2px;margin:20px 0}
h2{font:clamp(36px,6vw,61px)/1.05 'Playfair Display',serif;margin:18px 0}
h3{font:24px 'Playfair Display',serif}
em,.pink{color:var(--pink)}
.muted{color:var(--muted);line-height:1.85}
.center{text-align:center}
.btn{padding:13px 20px;border:1px solid var(--pink);background:var(--pink);color:#1b0d18;font-weight:700;transition:.25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px #f2a4c72e}
.ghost{background:transparent;color:var(--white);border-color:var(--line)}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:30px;flex-wrap:wrap}
.actions.right{justify-content:flex-end}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.cover{min-height:360px;border:1px solid #754c6c;background:linear-gradient(145deg,#4a203d,#1c1224 65%,#0c0910);padding:24px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 30px 90px #0008}
.cover-title{font:clamp(45px,6vw,73px)/.98 'Playfair Display',serif}
.cover-foot{display:flex;justify-content:space-between;letter-spacing:2px;font-size:9px;color:#dfc6dc}
.card-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.memory{height:180px;position:relative;background:linear-gradient(140deg,#3c243d,#15101b);border:1px solid var(--line);overflow:hidden;cursor:pointer}
.memory img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.memory .label{position:absolute;bottom:0;left:0;right:0;padding:22px 9px 9px;background:linear-gradient(transparent,#08060bf0);font-size:11px}
.memory .empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--pink);font-size:30px}
.memory .empty small{display:block;font-size:9px;letter-spacing:1px;color:var(--muted)}
.media-frame{width:min(780px,100%);margin:22px auto;border:1px solid #65445f;background:#100c14;padding:10px;box-shadow:0 25px 70px #0008}
video{width:100%;max-height:55vh;display:block;background:#050408}
.video-caption{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:13px 4px 2px;font-size:11px;color:var(--muted)}
.letter{max-width:740px;margin:22px auto;background:#171019;border:1px solid #51384f;padding:clamp(20px,5vw,45px);font:18px/1.9 'Playfair Display',serif;color:#eeddea}
.output{font:italic 23px/1.6 'Playfair Display',serif;color:var(--pink);margin:18px 0;min-height:34px}
.options{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.options button{background:#211725;border:1px solid #503852;color:white;padding:12px 15px}
.cake{font-size:90px;cursor:pointer;display:inline-block;transition:.3s}
.cake:hover{transform:scale(1.1)}
.countdown{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.time{padding:12px 16px;border:1px solid var(--line);min-width:70px;background:#120d16;text-align:center}
.time strong{display:block;font:27px 'Playfair Display',serif;color:var(--pink)}
.time small{font-size:8px;letter-spacing:2px;color:var(--muted)}
footer{padding:18px 5%;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid #ffffff12;font-size:10px;letter-spacing:1px;color:var(--muted)}
#gate{position:fixed;inset:0;z-index:20;background:#08060b;display:grid;place-items:center;text-align:center;padding:24px;transition:.7s}
#gate.hide{opacity:0;visibility:hidden}
.gate-box{max-width:510px}
.gate-box p{color:var(--muted);line-height:1.8}
#gateMsg{color:var(--pink);min-height:30px;margin-top:16px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:30;background:var(--pink);color:#170a13;padding:12px 18px;opacity:0;transition:.3s;pointer-events:none}
#toast.show{opacity:1}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.bit{position:absolute;top:-20px;width:8px;height:13px;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.1}}
@media(max-width:700px){header{height:60px}.hero-grid{grid-template-columns:1fr}.cover{min-height:280px}.card-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.memory{height:150px}#screen{padding:25px 0}footer{font-size:9px}}
</style>
</head>
<body>
<div id="stars"></div><div id="confetti"></div><div id="toast"></div>
<div id="gate"><div class="gate-box">
 <div class="pink" style="font-size:40px">✧ 𓆩♡𓆪 ✧</div>
 <div class="eyebrow">PRIVATE • MARYAM ONLY</div>
 <h1>Hold on,<br><em>birthday girl.</em></h1>
 <p>This little universe is for one dramatic, lovable human.<br>Are you Maryam, or are you here to steal the cake?</p>
 <button class="btn" onclick="enter()">OPEN MY SURPRISE ♡</button>
 <button class="btn ghost" onclick="nope()">I'm the cake inspector</button>
 <div id="gateMsg"></div>
</div></div>

<div id="app">
<header>
 <div class="logo">for maryam ♡</div>
 <div class="progress" id="progress"></div>
 <div style="font-size:10px;letter-spacing:2px;color:var(--muted)" id="stepLabel">01 / 07</div>
</header>
<main id="screen"></main>
<footer><span>THE MARYAM BIRTHDAY EDITION</span><span>MADE WITH LOVE ♡</span></footer>
</div>

<script>
const captions=[
"The beginning ♡","Our favourite chaos","A day to remember","My favourite human",
"Partners in crime","The laughter club","A forever memory","Unplanned adventures",
"The iconic moment","Just being us","Our little world","Pure chaos 😂",
"Another page of us","The good old days","My safe place","Main character energy",
"One for the scrapbook","The plot twist","To more memories","Always us ♡"
];
let current=0, cakeBlown=false;
const screen=document.getElementById('screen');
const pages=[
function(){return `
<div class="screen-content hero-grid">
 <div><div class="eyebrow">18 OCTOBER • YOUR SPECIAL EDITION</div>
 <h1>A little<br>world of<br><em>you.</em></h1>
 <p class="muted">For the girl who turns ordinary moments into memories. This tiny universe is made of friendship, laughter, and a little chaos.</p>
 <div class="countdown"><div class="time"><strong id="dd">--</strong><small>DAYS</small></div><div class="time"><strong id="hh">--</strong><small>HOURS</small></div><div class="time"><strong id="mm">--</strong><small>MINUTES</small></div><div class="time"><strong id="ss">--</strong><small>SECONDS</small></div></div>
 <p class="muted" style="font-size:11px">A surprise made especially for you ♡</p>
 <div class="actions right"><button class="btn" onclick="go(1)">BEGIN OUR STORY →</button></div></div>
 <div class="cover"><div class="cover-foot"><span>THE MARYAM ISSUE</span><span>VOL. 018</span></div><div class="cover-title">Rare soul.<br><em>Golden</em><br>heart.</div><div style="font-size:80px;text-align:center;color:var(--pink)">✷</div><div class="cover-foot"><span>ONE OF ONE</span><span>OCTOBER 18</span></div></div>
</div>`},
function(){return `<div class="screen-content"><div class="eyebrow">CHAPTER 01 • THE ARCHIVE</div><h2>Our little<br><em>museum.</em></h2><p class="muted">Twenty windows into our friendship. Click a photo to open it. Add your pictures in the images folder.</p><div class="card-grid" id="gallery"></div><p class="muted" style="font-size:11px;margin-top:16px">Photo files: images/memory1.jpg through images/memory20.jpg</p><div class="actions"><button class="btn ghost" onclick="go(0)">← BACK</button><button class="btn" onclick="go(2)">NEXT: OUR VIDEO →</button></div></div>`},
function(){return `<div class="screen-content center"><div class="eyebrow">CHAPTER 02 • OUR SPECIAL MOMENT</div><h2>A memory that<br><em>moves.</em></h2><p class="muted">Some memories deserve more than a picture. They deserve to be played again.</p><div class="media-frame"><video id="specialVideo" controls playsinline preload="metadata" poster="images/video-cover.jpg"><source src="videos/special-moment.mp4" type="video/mp4">Your browser cannot play this video.</video><div class="video-caption"><span>✧ OUR SPECIAL MOMENT</span><span>PRESS PLAY ♡</span></div></div><p class="muted" style="font-size:11px">Put your video at videos/special-moment.mp4. Use MP4 format for best compatibility.</p><div class="actions"><button class="btn ghost" onclick="go(1)">← BACK TO MEMORIES</button><button class="btn" onclick="go(3)">NEXT: OUR STORY →</button></div></div>`},
function(){return `<div class="screen-content"><div class="eyebrow">CHAPTER 03 • TO BE CONTINUED</div><h2>Us, in <em>chapters.</em></h2><div class="card-grid" style="grid-template-columns:repeat(3,minmax(0,1fr))"><article><div class="pink">01 / BEGINNING</div><h3>The day we met.</h3><p class="muted">Two people who had no idea how many memories were waiting ahead.</p></article><article><div class="pink">02 / PLOT TWIST</div><h3>We became us.</h3><p class="muted">Random talks turned into favourite moments. Ordinary days became special.</p></article><article><div class="pink">03 / NEXT ERA</div><h3>Still writing.</h3><p class="muted">More adventures, more laughter, and stories we will tell for years.</p></article></div><div class="actions"><button class="btn ghost" onclick="go(2)">← BACK</button><button class="btn" onclick="go(4)">NEXT: YOUR LETTER →</button></div></div>`},
function(){return `<div class="screen-content"><div class="eyebrow">CHAPTER 04 • FROM MY HEART</div><h2>Dear Maryam,<br><em>always.</em></h2><div class="letter"><p>Happy birthday to a girl who deserves beautiful things, gentle days, and a thousand reasons to smile. ♡</p><p>I hope this new chapter brings you closer to every dream you quietly keep in your heart. May you find peace when life gets loud, courage when things feel difficult, and people who love you for exactly who you are.</p><p>Thank you for being part of my story. Thank you for the laughs, the random talks, and the memories that make normal days special.</p><p>And yes, you're still annoying. But our friendship contract has no cancellation policy. 😂</p><p class="pink">With love, endless duas, and a little madness,<br>Your favourite human ♡</p></div><div class="actions"><button class="btn ghost" onclick="go(3)">← BACK</button><button class="btn" onclick="go(5)">NEXT: FUN ZONE →</button></div></div>`},
function(){return `<div class="screen-content"><div class="eyebrow">CHAPTER 05 • NO SERIOUSNESS ALLOWED</div><h2>The Maryam<br><em>department.</em></h2><div class="card-grid" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div><h3>Friendly fire 🔥</h3><button class="btn ghost" onclick="roast()">ROAST HER</button><div class="output" id="roastOut">Classified results...</div></div><div><h3>Friendship test</h3><p class="muted">What keeps friendship strong?</p><div class="options"><button onclick="quiz(0)">Trust</button><button onclick="quiz(1)">Free food</button><button onclick="quiz(2)">Stealing clothes</button></div><div class="muted" id="quizOut"></div></div><div><h3>Compliment machine ♡</h3><button class="btn ghost" onclick="compliment()">MAKE ME SMILE</button><div class="output" id="compOut">A reminder is waiting...</div></div></div><div class="actions"><button class="btn ghost" onclick="go(4)">← BACK</button><button class="btn" onclick="go(6)">FINAL SURPRISE →</button></div></div>`},
function(){return `<div class="screen-content center"><div class="eyebrow">CHAPTER 06 • THE GRAND FINALE</div><h2>Make a wish,<br><em>birthday girl.</em></h2><p class="muted">Close your eyes. Make a secret wish. Tap the cake to blow out the candle.</p><div class="cake" id="cake" onclick="blow()">🎂</div><div class="output" id="cakeOut">One candle. One wish. Endless possibilities. ♡</div><button class="btn" onclick="finale()">REVEAL YOUR LAST MESSAGE ✧</button><div class="letter" id="finalLetter" style="display:none"><p>Maryam, may this year bring you happiness that stays, love that feels safe, and beautiful moments you never expected. May your dreams grow bigger and your heart stay soft.</p><p class="pink">Happy birthday, meri dost. You are loved more than words can say. ♡</p></div><div class="actions"><button class="btn ghost" onclick="go(5)">← BACK</button><button class="btn" onclick="go(0)">REPLAY OUR STORY ↻</button></div></div>`}
];
function render(){
 screen.innerHTML=pages[current]();
 screen.style.animation='none';void screen.offsetWidth;screen.style.animation='appear .55s ease';
 document.getElementById('stepLabel').textContent=String(current+1).padStart(2,'0')+' / 07';
 document.getElementById('progress').innerHTML=pages.map((_,i)=>'<span class="dot '+(i===current?'active':'')+'"></span>').join('');
 if(current===1)makeGallery();
 if(current===0)countdown();
}
function go(n){current=n;render();window.scrollTo(0,0)}
function enter(){document.getElementById('gate').classList.add('hide');confetti()}
function nope(){document.getElementById('gateMsg').textContent=["FBI? Your badge says cake thief. 😂","Access denied. Bribe us with chocolate.","Maryam's security team has been notified. (It's one friend.)"][Math.floor(Math.random()*3)]}
function makeGallery(){
 const g=document.getElementById('gallery');if(!g)return;
 captions.forEach((caption,i)=>{
  const card=document.createElement('div');card.className='memory';
  const img=document.createElement('img');img.src='images/memory'+(i+1)+'.jpg';img.alt=caption;
  const empty=document.createElement('div');empty.className='empty';empty.innerHTML='✧<small>MEMORY '+String(i+1).padStart(2,'0')+'</small>';
  img.onerror=()=>img.style.display='none';img.onload=()=>empty.style.display='none';
  const label=document.createElement('div');label.className='label';label.textContent=caption;
  card.append(img,empty,label);card.onclick=()=>openPhoto(img,caption,i);g.appendChild(card);
 });
}
function openPhoto(img,caption,i){
 const w=window.open('','_blank');
 if(!w){alert(caption+' — '+(img.naturalWidth?'Photo loaded':'Add images/memory'+(i+1)+'.jpg to show this photo.'));return}
 w.document.write('<title>'+caption+'</title><body style="margin:0;background:#08060b;color:#fff;text-align:center;font-family:Georgia;padding:20px"><h2>'+caption+'</h2>'+(img.naturalWidth?'<img style="max-width:95%;max-height:80vh" src="'+img.src+'">':'<p>Add images/memory'+(i+1)+'.jpg to display this photo.</p>')+'</body>');
}
function countdown(){
 const now=new Date();let t=new Date(now.getFullYear(),9,18);
 if(now>new Date(now.getFullYear(),9,18,23,59,59))t=new Date(now.getFullYear()+1,9,18);
 const d=t-now;const vals=[Math.floor(d/86400000),Math.floor(d%86400000/3600000),Math.floor(d%3600000/60000),Math.floor(d%60000/1000)];
 ['dd','hh','mm','ss'].forEach((id,i)=>{const e=document.getElementById(id);if(e)e.textContent=vals[i]});
}
setInterval(()=>{if(current===0)countdown()},1000);
function roast(){const a=["She says two minutes and arrives next calendar year. 😂","Her screen time needs its own degree.","One small story becomes a twelve-season drama.","Overthinking? She runs an investigation agency.","Main character energy, background character punctuality."];const e=document.getElementById('roastOut');if(e)e.textContent=a[Math.floor(Math.random()*a.length)]}
function quiz(n){const e=document.getElementById('quizOut');if(e)e.textContent=n===0?'Correct! Trust first, snacks second. ♡':n===1?'Snacks are important, but trust comes first. 😂':'Borrowing clothes is tradition, not the foundation. 😭'}
function compliment(){const a=["You make ordinary days feel special. ♡","You deserve the kindness you give others.","Your laugh makes the world lighter.","You are allowed to grow at your own pace.","Never dim your light for anyone. ✨"];const e=document.getElementById('compOut');if(e)e.textContent=a[Math.floor(Math.random()*a.length)]}
function blow(){cakeBlown=!cakeBlown;const e=document.getElementById('cake');if(e)e.textContent=cakeBlown?'🍰':'🎂';const m=document.getElementById('cakeOut');if(m)m.textContent=cakeBlown?'Wish sent to the universe. May beautiful things find you. ✨':'Your candle is back! Make another wish. ♡';if(cakeBlown)confetti()}
function finale(){confetti();const e=document.getElementById('finalLetter');if(e)e.style.display='block';const m=document.getElementById('cakeOut');if(m)m.textContent='HAPPY BIRTHDAY, MARYAM! ♡'}
function confetti(){const c=document.getElementById('confetti'),colors=['#f2a4c7','#c4a8ff','#fff5fb','#e7c47a'];for(let i=0;i<90;i++){const b=document.createElement('i');b.className='bit';b.style.left=Math.random()*100+'%';b.style.background=colors[Math.floor(Math.random()*colors.length)];b.style.animationDelay=Math.random()+'s';c.appendChild(b);setTimeout(()=>b.remove(),4500)}}
render();
</script>
</body>
</html>
