<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEMORIES - Maryam Luxury Edition</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #030303; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; position: relative; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #E50914; border-radius: 10px; }

        /* Floating Neon Ambient Canvas */
        #particle-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.5; }

        /* Fixed High-End Intro Screen */
        #intro { position: fixed; inset: 0; background: #000; z-index: 99999; display: flex; align-items: center; justify-content: center; flex-direction: column; transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        #intro.hide { opacity: 0; visibility: hidden; transform: scale(1.1); }
        
        .m-logo { font-family: 'Bebas Neue'; font-size: 240px; color: #E50914; font-weight: 900; letter-spacing: -8px; text-shadow: 0 0 60px rgba(229,9,20,0.6); animation: pulseGlow 2s infinite ease-in-out; }
        @keyframes pulseGlow { 0%, 100% { text-shadow: 0 0 40px rgba(229,9,20,0.4); } 50% { text-shadow: 0 0 70px rgba(229,9,20,0.8); } }
        
        .intro-txt { letter-spacing: 16px; color: #888; font-size: 13px; margin-top: -10px; font-weight: 400; text-transform: uppercase; }
        
        .enter-btn { margin-top: 50px; padding: 16px 40px; background: #E50914; border: none; color: #fff; letter-spacing: 5px; font-size: 12px; font-weight: 700; cursor: pointer; border-radius: 50px; box-shadow: 0 0 30px rgba(229,9,20,0.5); transition: 0.3s; }
        .enter-btn:hover { transform: scale(1.05); box-shadow: 0 0 45px rgba(229,9,20,0.8); background: #ff0f1b; }

        /* Header */
        .header { position: fixed; top: 0; width: 100%; padding: 25px 6%; display: flex; justify-content: space-between; align-items: center; z-index: 100; background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%); }
        .logo { font-family: 'Bebas Neue'; font-size: 45px; color: #E50914; letter-spacing: 4px; }
        .logo span { color: #fff; font-size: 12px; letter-spacing: 6px; margin-left: 12px; font-family: 'Inter'; font-weight: 300; border-left: 1px solid #333; padding-left: 12px; }
        .profile { width: 40px; height: 40px; background: linear-gradient(45deg, #E50914, #800000); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; box-shadow: 0 0 15px rgba(229,9,20,0.4); }

        /* Luxury Hero Section */
        .hero { height: 100vh; position: relative; display: flex; align-items: center; padding: 0 6%; background: #000; z-index: 2; }
        .hero-bg { position: absolute; inset: 0; background: linear-gradient(75deg, rgba(3,3,3,1) 0%, rgba(3,3,3,0.6) 40%, transparent 90%), url('https://unsplash.com') no-repeat center/cover; opacity: 0.9; }
        .hero-content { position: relative; z-index: 5; max-width: 700px; margin-top: 40px; }
        .badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(229,9,20,0.15); border: 1px solid rgba(229,9,20,0.5); padding: 7px 18px; border-radius: 20px; font-size: 11px; letter-spacing: 3px; color: #E50914; font-weight: 700; margin-bottom: 25px; text-transform: uppercase; }
        .hero h1 { font-size: 85px; font-weight: 900; line-height: 0.85; letter-spacing: -3px; }
        .hero h1 span { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 600; font-size: 32px; letter-spacing: 2px; display: block; color: #E50914; margin-top: 15px; text-shadow: 0 0 15px rgba(229,9,20,0.4); }
        .hero p { color: #ccc; font-size: 16px; margin-top: 25px; line-height: 1.8; max-width: 520px; font-weight: 300; }
        
        /* Premium Interactive Buttons */
        .btns { display: flex; gap: 18px; margin-top: 40px; }
        .btn { padding: 16px 38px; border: none; border-radius: 6px; font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); letter-spacing: 0.5px; }
        .btn-white { background: #fff; color: #000; box-shadow: 0 4px 20px rgba(255,255,255,0.15); }
        .btn-white:hover { background: #E50914; color: #fff; box-shadow: 0 5px 30px rgba(229,9,20,0.6); transform: translateY(-3px); }
        .btn-gray { background: rgba(255,255,255,0.08); color: #fff; backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); }
        .btn-gray:hover { background: rgba(255,255,255,0.2); transform: translateY(-3px); border-color: rgba(255,255,255,0.3); box-shadow: 0 5px 20px rgba(255,255,255,0.1); }

        /* Rows & Horizontal Sliders */
        .row { padding: 40px 0 0 6%; position: relative; z-index: 5; }
        .row-title { font-size: 24px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 14px; letter-spacing: 0.5px; }
        .row-title small { font-size: 11px; letter-spacing: 4px; color: #666; font-weight: 600; text-transform: uppercase; }
        .slider { display: flex; gap: 16px; overflow-x: auto; padding: 10px 0 40px 0; scrollbar-width: none; }
        .slider::-webkit-scrollbar { display: none; }
        
        .card { min-width: 320px; height: 180px; background: #0d0d0d; border-radius: 8px; overflow: hidden; position: relative; cursor: pointer; transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); border: 1px solid #181818; }
        .card:hover { transform: scale(1.07) translateY(-8px); border-color: #E50914; z-index: 10; box-shadow: 0 15px 35px rgba(229,9,20,0.35); }
        .card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s ease; filter: brightness(0.8); }
        .card:hover img { transform: scale(1.1); filter: brightness(1); }
        .card-top { position: absolute; top: 12px; left: 12px; background: #E50914; padding: 4px 10px; font-size: 9px; font-weight: 800; border-radius: 3px; letter-spacing: 1px; text-transform: uppercase; }
        .card-bottom { position: absolute; bottom: 0; width: 100%; padding: 18px; background: linear-gradient(0deg, rgba(0,0,0,1) 0%, rgba(0,0,0,0.8) 60%, transparent 100%); }
        .card-bottom h4 { font-size: 15px; font-weight: 600; letter-spacing: 0.3px; }
        .card-bottom p { font-size: 11px; color: #46d369; margin-top: 6px; font-weight: 600; display: flex; align-items: center; gap: 5px; }

        /* Aesthetic Modals (Fix Layer) */
        .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(20px); z-index: 100000; display: none; align-items: center; justify-content: center; padding: 4%; }
        .modal.show { display: flex; }
        .modal-box { width: 100%; max-width: 750px; background: #121212; border-radius: 16px; overflow: hidden; border: 1px solid #252525; box-shadow: 0 30px 60px rgba(0,0,0,0.8); position: relative; }
        .modal-img { height: 45vh; background-size: cover; background-position: center; position: relative; }
        .modal-img::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, #121212 0%, transparent 70%); }
        .modal-close { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.1); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 100; font-size: 18px; transition: 0.3s; }
        .modal-close:hover { background: #E50914; border-color: #E50914; transform: rotate(90deg); }
        
        /* Interactive Gift & Meter Custom UI */
        .gift-container { text-align: center; padding: 45px 25px; }
        .gift-box { font-size: 85px; cursor: pointer; transition: transform 0.3s; animation: bounce 2s infinite; display: inline-block; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-15px); } 60% { transform: translateY(-7px); } }
        .secret-letter { display: none; margin-top: 30px; padding: 30px; background: #181818; border-radius: 12px; border-left: 5px solid #E50914; text-align: left; font-size: 15px; line-height: 1.9; color: #ddd; font-style: italic; }
        
        /* Compatibility Meter */
        .meter-box { margin-top: 25px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
        .meter-input { padding: 12px 20px; background: #222; border: 1px solid #333; border-radius: 5px; color: #fff; width: 80%; text-align: center; font-size: 14px; outline: none; }
        .meter-bar { width: 100%; height: 8px; background: #222; border-radius: 10px; overflow: hidden; display: none; margin-top: 15px; }
        .meter-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ff416c, #ff4b2b); transition: width 2s ease-in-out; }
    </style>
</head>
<body>

    <!-- Ambient Floating Particles Layer -->
    <canvas id="particle-canvas"></canvas>

    <!-- Background Score Setup -->
    <audio id="bg-music" src="https://zeno.fm" loop preload="auto" crossorigin="anonymous"></audio>

    <!-- Fixed Premium Entrance Screen -->
    <div id="intro">
        <div class="m-logo">M</div>
        <div class="intro-txt">MEMORIES ORIGINAL PRESENTS</div>
        <button class="enter-btn" onclick="letGoIntro()">UNLOCK THE STORY</button>
    </div>

    <!-- Main Navigation Header -->
    <div class="header">
        <div class="logo">MEMORIES <span>LUXURY</span></div>
