<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEMORIES - Maryam Premium Edition</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #050505; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; position: relative; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #E50914; border-radius: 10px; }

        /* Background Particle Canvas */
        #particle-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.6; }

        /* High-End Intro Screen */
        #intro { position: fixed; inset: 0; background: radial-gradient(circle, #111 0%, #000 100%); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1), opacity 1s; }
        #intro.hide { transform: translateY(-100%); opacity: 0; pointer-events: none; }
        .m-logo { font-family: 'Bebas Neue'; font-size: 220px; color: #E50914; font-weight: 900; letter-spacing: -10px; transform: scale(0); animation: mIn 1.5s cubic-bezier(0.77, 0, 0.175, 1) forwards; text-shadow: 0 0 50px rgba(229,9,20,0.4); }
        @keyframes mIn { 0% { transform: scale(0) rotate(-15deg); } 70% { transform: scale(1.05) rotate(2deg); } 100% { transform: scale(1) rotate(0); } }
        .intro-txt { letter-spacing: 15px; color: #aaa; font-size: 14px; margin-top: 10px; opacity: 0; animation: fade 1s forwards 1.2s; font-weight: 300; }
        .enter-btn { margin-top: 40px; padding: 12px 30px; background: transparent; border: 1px solid #E50914; color: #fff; letter-spacing: 4px; font-size: 11px; cursor: pointer; border-radius: 50px; transition: 0.4s; opacity: 0; animation: fade 1s forwards 1.5s; }
        .enter-btn:hover { background: #E50914; box-shadow: 0 0 20px #E50914; transform: scale(1.05); }
        @keyframes fade { to { opacity: 1; } }

        /* Header */
        .header { position: fixed; top: 0; width: 100%; padding: 25px 5%; display: flex; justify-content: space-between; align-items: center; z-index: 100; background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%); }
        .logo { font-family: 'Bebas Neue'; font-size: 42px; color: #E50914; letter-spacing: 3px; text-shadow: 0 0 10px rgba(229,9,20,0.3); }
        .logo span { color: #fff; font-size: 12px; letter-spacing: 6px; margin-left: 10px; font-family: 'Inter'; font-weight: 300; border-left: 1px solid #333; padding-left: 10px; }
        .profile { width: 38px; height: 38px; background: #E50914; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; box-shadow: 0 0 15px rgba(229,9,20,0.5); }

        /* Luxury Hero Section */
        .hero { height: 95vh; position: relative; display: flex; align-items: center; padding: 0 5%; background: #000; z-index: 2; }
        .hero-bg { position: absolute; inset: 0; background: linear-gradient(75deg, rgba(5,5,5,1) 0%, rgba(5,5,5,0.7) 40%, transparent 90%), url('https://unsplash.com') no-repeat center/cover; opacity: 0.85; }
        .hero-content { position: relative; z-index: 5; max-width: 650px; margin-top: 50px; }
        .badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(229,9,20,0.12); border: 1px solid rgba(229,9,20,0.4); padding: 6px 16px; border-radius: 20px; font-size: 11px; letter-spacing: 3px; color: #E50914; font-weight: 600; margin-bottom: 22px; text-transform: uppercase; }
        .hero h1 { font-size: 80px; font-weight: 900; line-height: 0.85; letter-spacing: -3px; }
        .hero h1 span { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 600; font-size: 28px; letter-spacing: 2px; display: block; color: #E50914; margin-top: 12px; text-shadow: 0 0 15px rgba(229,9,20,0.3); }
        .hero p { color: #bbb; font-size: 15px; margin-top: 22px; line-height: 1.7; max-width: 480px; font-weight: 300; }
        
        /* Premium Buttons */
        .btns { display: flex; gap: 15px; margin-top: 35px; }
        .btn { padding: 15px 35px; border: none; border-radius: 5px; font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94); letter-spacing: 0.5px; }
        .btn-white { background: #fff; color: #000; box-shadow: 0 4px 15px rgba(255,255,255,0.2); }
        .btn-white:hover { background: #E50914; color: #fff; box-shadow: 0 5px 25px rgba(229,9,20,0.5); transform: translateY(-2px); }
        .btn-gray { background: rgba(255,255,255,0.1); color: #fff; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .btn-gray:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); border-color: rgba(255,255,255,0.3); }

        /* Cinematic Rows & Cards */
        .row { padding: 30px 0 0 5%; position: relative; z-index: 5; }
        .row-title { font-size: 22px; font-weight: 700; margin-bottom: 18px; display: flex; align-items: center; gap: 12px; letter-spacing: 0.5px; }
        .row-title small { font-size: 11px; letter-spacing: 4px; color: #555; font-weight: 500; text-transform: uppercase; }
        .slider { display: flex; gap: 14px; overflow-x: auto; padding: 10px 0 35px 0; scrollbar-width: none; }
        .slider::-webkit-scrollbar { display: none; }
        
        .card { min-width: 310px; height: 175px; background: #0f0f0f; border-radius: 8px; overflow: hidden; position: relative; cursor: pointer; transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1); border: 1px solid #1a1a1a; }
        .card:hover { transform: scale(1.08) translateY(-8px); border-color: #E50914; z-index: 10; box-shadow: 0 15px 35px rgba(229,9,20,0.3); }
        .card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s ease; filter: brightness(0.85); }
        .card:hover img { transform: scale(1.12); filter: brightness(1.05); }
        .card-top { position: absolute; top: 10px; left: 10px; background: #E50914; padding: 3px 8px; font-size: 9px; font-weight: 700; border-radius: 3px; letter-spacing: 1px; text-transform: uppercase; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .card-bottom { position: absolute; bottom: 0; width: 100%; padding: 15px; background: linear-gradient(0deg, rgba(0,0,0,1) 0%, rgba(0,0,0,0.8) 60%, transparent 100%); }
        .card-bottom h4 { font-size: 14px; font-weight: 600; letter-spacing: 0.3px; }
        .card-bottom p { font-size: 11px; color: #46d369; margin-top: 5px; font-weight: 600; display: flex; align-items: center; gap: 5px; }

        /* Universal Premium Modals */
        .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92); backdrop-filter: blur(12px); z-index: 10000; display: none; align-items: center; justify-content: center; padding: 4%; opacity: 0; transition: opacity 0.4s ease; }
        .modal.show { display: flex; opacity: 1; }
        .modal-box { width: 100%; max-width: 800px; background: #141414; border-radius: 12px; overflow: hidden; transform: scale(0.9); transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); border: 1px solid #222; box-shadow: 0 25px 50px rgba(0,0,0,0.6); }
        .modal.show .modal-box { transform: scale(1); }
        .modal-img { height: 42vh; background-size: cover; background-position: center; position: relative; }
        .modal-img::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, #141414 0%, transparent 60%); }
        .modal-close { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.2); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; transition: 0.3s; font-size: 16px; }
        .modal-close:hover { background: #E50914; border-color: #E50914; transform: rotate(90deg); }
        
        /* Gift Section Custom UI */
        .gift-container { text-align: center; padding: 40px 20px; }
        .gift-box { font-size: 80px; cursor: pointer; transition: transform 0.3s; animation: bounce 2s infinite; display: inline-block; }
        .gift-box:hover { transform: scale(1.15); }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-20px); } 60% { transform: translateY(-10px); } }
        .secret-letter { display: none; margin-top: 25px; padding: 25px; background: #1c1c1c; border-radius: 8px; border-left: 4px solid #E50914; text-align: left; font-size: 15px; line-height: 1.8; color: #ddd; font-style: italic; }
    </style>
</head>
<body>

    <!-- Background Cinematic Hearts -->
    <canvas id="particle-canvas"></canvas>

    <!-- Background Music (Replace the URL with your own song link if needed) -->
    <audio id="bg-music" src="https://soundhelix.com" loop></audio>

    <!-- Intro Screen -->
    <div id="intro">
        <div class="m-logo">M</div>
        <div class="intro-txt">MEMORIES ORIGINAL PRESENTS</div>
        <button class="enter-btn" onclick="enterExperience()">UNLOCK THE STORY</button>
    </div>

    <!-- Header Navigation -->
    <div class="header">
        <div class="logo">MEMORIES <span>PREMIUM</span></div>
        <div class="profile">M</div>
    </div>

    <!-- Luxury Hero Section -->
    <div class="hero">
        <div class="hero-bg"></div>
        <div class="hero-content">
            <div class="badge">✦ Special Premiere • Birthday Special</div>
